<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina de DonAndriuw</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Capa de los Brillos -->
    <div class="contenedor-brillos">
      <div class="brillo b1">✦</div>
      <div class="brillo b2">✧</div>
      <div class="brillo b3">✦</div>
      <div class="brillo b4">✧</div>
      <div class="brillo b5">✦</div>
    </div>

    <main class="escenario">
      <section class="tarjeta" aria-label="Perfil de DonAndriuw">
        <span class="titulo-badge">Mi mundo en línea</span>
        <div class="avatar-wrap">
          <img class="avatar" src="assets/avatar.png" alt="DonAndriuw" />
        </div>
        <h1>DonAndriuw</h1>
        <p class="descripcion">
          Youtuber, Editor, Loremaker y intento de Tiktoker, unete a mi refugio, unete a los pinguinos, se un pinguino.
        </p>

        <nav class="enlaces" id="caja-redes" aria-label="Redes sociales"></nav>
      </section>
    </main>
    <!-- Reproductor de mÃºsica angelical -->
    <div class="reproductor-musica">
      <!-- Reemplaza el link de abajo por el enlace directo de tu canciÃ³n en formato .mp3 -->
      <audio id="miMusica" loop autoplay playsinline>
        <source
          src="https://www.dropbox.com/scl/fi/cc4m3tkdh0eao4vqo7td8/Great-Fairy-Fountain.mp3?rlkey=6babqjobst5j9lxaflimfao3w&st=sjp9w08i&dl=1"
          type="audio/mpeg"
        />
        Tu navegador no soporta audio.
      </audio>
      <button onclick="controlarMusica()" id="btnMusica">✨ Play Music</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
